<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Logistics DAX: Power BI logistics dashboard: 200 shipments, R$ 7.39M revenue, carrier ranking">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/><stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c811"/><stop offset="0.45" stop-color="#f5fbff"/>
      <stop offset="0.55" stop-color="#f5fbff"/><stop offset="1" stop-color="#f2c811"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2c811" stop-opacity="0.30"/><stop offset="1" stop-color="#f2c811" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2430" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 1040px 180px; }
      @keyframes pulse { 0%, 100% { transform: scale(0.92); opacity: .65; } 50% { transform: scale(1.08); opacity: 1; } }
      .fade { opacity: 0; animation: fade 8s infinite; }
      @keyframes fade { 0% { opacity: 0; transform: translateY(8px); } 6% { opacity: 1; transform: none; } 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
      .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 8s ease-out infinite; }
      @keyframes grow { 0% { transform: scaleY(0); } 18% { transform: scaleY(1); } 88% { transform: scaleY(1); opacity: 1; } 96%, 100% { transform: scaleY(1); opacity: 0; } }
      .growx { transform-box: fill-box; transform-origin: left; animation: growx 8s ease-out infinite; }
      @keyframes growx { 0% { transform: scaleX(0); } 18% { transform: scaleX(1); } 88% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
      .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 8s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 35% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { opacity: 0; } }
      .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .9s; }
      .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
      .d7 { animation-delay: 2.1s; } .d8 { animation-delay: 2.4s; } .d9 { animation-delay: 2.7s; }
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.55"/>
  <circle class="pulse" cx="1040" cy="180" r="175" fill="url(#glow)"/>
  <rect x="64" y="64" width="6" height="232" rx="3" fill="#f2c811"/>
  <text x="96" y="96" class="mono" font-size="16" fill="#f2c811" letter-spacing="2">POWER BI · DAX</text>
  <text x="92" y="167" class="sans" font-size="88" font-weight="800" fill="url(#shine)">Logistics DAX</text>
  <text x="96" y="212" class="sans" font-size="20" fill="#9aa7b2">Power BI logistics dashboard: 200 shipments, R$ 7.39M revenue,</text><text x="96" y="238" class="sans" font-size="20" fill="#9aa7b2">carrier ranking</text>
  <rect x="96" y="262" width="88" height="28" rx="14" fill="#161b22" stroke="#f2c811" stroke-opacity="0.45"/><text x="140" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Power BI</text><rect x="194" y="262" width="47" height="28" rx="14" fill="#161b22" stroke="#f2c811" stroke-opacity="0.45"/><text x="217" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">DAX</text><rect x="250" y="262" width="112" height="28" rx="14" fill="#161b22" stroke="#f2c811" stroke-opacity="0.45"/><text x="306" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Power Query</text>
  <g><rect x="850" y="40" width="380" height="280" rx="16" fill="#12151c" stroke="#2a3542"/><rect x="870" y="58" width="164" height="60" rx="10" fill="#1b2029"/><rect x="1046" y="58" width="164" height="60" rx="10" fill="#1b2029"/><text x="884" y="80" class="mono" font-size="10" fill="#8b949e">REVENUE 2025</text><text x="884" y="106" class="sans" font-size="22" font-weight="800" fill="#f2c811">R$ 7.39M</text><text x="1060" y="80" class="mono" font-size="10" fill="#8b949e">SHIPMENTS</text><text x="1060" y="106" class="sans" font-size="22" font-weight="800" fill="#f5fbff">200</text><text x="870" y="156" class="sans" font-size="12" fill="#c9d1d9">Swift Cargo</text><rect x="960" y="142" width="250" height="18" rx="5" fill="#1b2029"/><rect class="growx d1" x="960" y="142" width="250" height="18" rx="5" fill="#f2c811" fill-opacity="1.00"/><text x="870" y="190" class="sans" font-size="12" fill="#c9d1d9">JadLog</text><rect x="960" y="176" width="250" height="18" rx="5" fill="#1b2029"/><rect class="growx d2" x="960" y="176" width="223" height="18" rx="5" fill="#f2c811" fill-opacity="0.88"/><text x="870" y="224" class="sans" font-size="12" fill="#c9d1d9">Intra Cargo</text><rect x="960" y="210" width="250" height="18" rx="5" fill="#1b2029"/><rect class="growx d3" x="960" y="210" width="180" height="18" rx="5" fill="#f2c811" fill-opacity="0.76"/><text x="870" y="258" class="sans" font-size="12" fill="#c9d1d9">XP Log.</text><rect x="960" y="244" width="250" height="18" rx="5" fill="#1b2029"/><rect class="growx d4" x="960" y="244" width="168" height="18" rx="5" fill="#f2c811" fill-opacity="0.64"/><text x="870" y="292" class="sans" font-size="12" fill="#c9d1d9">TransGlobal</text><rect x="960" y="278" width="250" height="18" rx="5" fill="#1b2029"/><rect class="growx d5" x="960" y="278" width="156" height="18" rx="5" fill="#f2c811" fill-opacity="0.52"/></g>
</svg>
